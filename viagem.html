  --text:#E7EAF4; --muted:#9AA2BC; --line:#2B3259; --warn:#F2B35A; --warn-wash:#3A2A12;

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:84px}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}

/* Cabeçalho: faixa verde com losango amarelo, como a toalha da foto */
.hero{position:relative;overflow:hidden;background:#13823F;color:#fff;padding:28px 20px 34px}
.hero::before{content:"";position:absolute;width:520px;height:520px;background:#F2C200;transform:rotate(45deg);left:-330px;top:40px;opacity:.95}
.hero-inner{position:relative;max-width:760px;margin:0 auto}
.note{background:#fff;color:#2439A8;border-radius:4px 4px 10px 4px;padding:14px 18px 16px;box-shadow:0 10px 24px rgba(0,0,0,.18);transform:rotate(-1.2deg);max-width:440px;margin-left:auto}
.note h1{font-family:var(--hand);font-weight:700;font-size:2.6rem;line-height:1;margin:0 0 4px}
.note p{font-family:var(--hand);font-size:1.45rem;margin:0;line-height:1.15}
.count{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;padding:4px 12px;border-radius:999px;font-size:.88rem;font-weight:600}
.theme-btn{position:absolute;left:0;top:0;background:rgba(0,0,0,.25);border:0;color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem}

main{max-width:760px;margin:0 auto;padding:18px 16px 0}
.view{display:none}
.view.on{display:block}
h2.section{font-family:var(--hand);font-size:2.1rem;color:var(--ink);margin:10px 0 6px;font-weight:700;line-height:1.1}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}

/* Linha do tempo */
.day{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
.day-head{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:12px 14px}
.date{text-align:center;border-right:2px dashed var(--line);padding-right:10px}
.date b{display:block;font-family:var(--hand);font-size:2rem;line-height:.9;color:var(--ink)}
.date span{font-size:.75rem;color:var(--muted);font-weight:600}
.day-title{font-weight:700;font-size:1.05rem;line-height:1.25}
.day-sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.star{color:var(--ink);font-family:var(--hand);font-size:1.6rem;line-height:1}
.chev{transition:transform .2s;color:var(--muted)}
.day.open .chev{transform:rotate(180deg)}
.day{border-left-width:6px}
.day.st-done{border-left-color:var(--green);background:var(--good-wash)}
.day.st-now{border-left-color:var(--yellow);background:var(--warn-wash);box-shadow:0 0 0 2px var(--yellow)}
.day.st-next{border-left-color:var(--ink)}
.day.st-done .day-title{color:var(--good)}
.tag.s-done{background:var(--green);color:#fff}
.tag.s-now{background:var(--yellow);color:#3A2A00}
.tag.s-next{background:var(--ink-wash);color:var(--ink)}
.tag.rem,.tag.obs{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:0 0 12px}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:4px;display:inline-block}
.lg.done{background:var(--green)} .lg.now{background:var(--yellow)} .lg.next{background:var(--ink)}
.rem-panel h4{margin:0 0 6px;color:var(--ink)}
.rem-item{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.rem-item:last-child{border-bottom:0}
.rem-item b{color:var(--ink);font-variant-numeric:tabular-nums}
.rem-item small{grid-column:2;color:var(--muted)}
.rem-item.soon{background:var(--warn-wash);border-radius:8px;padding:7px 8px}
.rem-item.soon b{color:var(--warn)}
.rem-item.past{opacity:.55}
.rem-box,.obs-box{background:var(--card);border:1px solid var(--line)}
.rem-box h4,.obs-box h4{color:var(--ink)}
.rem-ul{list-style:none;margin:4px 0 0;padding:0}
.rem-li{display:grid;grid-template-columns:52px 1fr auto auto;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.rem-li .t{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.mini{background:none;border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.obs-box textarea{min-height:80px;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px}
.day-body{display:none;padding:0 14px 16px;border-top:1px solid var(--line)}
.day.open .day-body{display:block}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;margin-top:6px}
.tag.home{background:var(--good-wash);color:var(--good)}
.tag.road{background:var(--ink-wash);color:var(--ink)}
.tag.faith{background:var(--warn-wash);color:var(--warn)}

.stops{list-style:none;margin:12px 0 0;padding:0}
.stop{display:grid;grid-template-columns:26px 58px 1fr 30px;gap:6px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
.stop input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.stop .t{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;font-size:.92rem;padding-top:1px}
.stop.done .txt{text-decoration:line-through;color:var(--muted)}
.stop.special{background:var(--warn-wash);border-radius:10px;padding:10px 8px;border-bottom:0;margin:6px 0}
.stop.special .t{color:var(--warn)}
.del{background:none;border:0;color:var(--muted);font-size:1.1rem;line-height:1;padding:4px}
.del:hover{color:var(--danger)}
.rename{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px;align-items:end}
.rename label{display:flex;flex-direction:column;font-size:.78rem;color:var(--muted);font-weight:600;gap:3px}
.rename input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0;font-weight:500;color:var(--text);font-size:.95rem}
.rename .btn{grid-column:1/-1;justify-self:start}
@media (max-width:420px){.rename{grid-template-columns:1fr}}
.add-row{display:grid;grid-template-columns:88px 1fr auto;gap:8px;margin-top:10px}
.add-row input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;min-width:0}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:600}
:root[data-theme="dark"] .btn{color:#0F1328}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0F1328}}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.box{border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.93rem}
.box h4{margin:0 0 4px;font-size:.9rem}
.box.sea{background:var(--sea-wash)}
.box.sea h4{color:var(--sea)}
.box.sun{background:var(--warn-wash)}
.box.sun h4{color:var(--warn)}
.box.ink{background:var(--ink-wash)}
.box.ink h4{color:var(--ink)}
.box ul{margin:4px 0 0;padding-left:18px}
.box li{margin:2px 0}

/* Marés */
.tide-svg{width:100%;height:auto;display:block;margin-top:6px}
.tide-list{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tide-chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.82rem;font-variant-numeric:tabular-nums}
.tide-chip.low{border-color:var(--sea);color:var(--sea);font-weight:700}
.verdict{font-weight:600;margin-top:6px}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--warn)}
.tide-table{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.tide-table th,.tide-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tide-table th{color:var(--muted);font-weight:600;font-size:.8rem}
.scroll{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--line);position:relative;min-width:80px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--sea)}

/* Dicas */
.city{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.city h3{font-family:var(--hand);font-size:1.9rem;color:var(--ink);margin:0;line-height:1}
.city .when{color:var(--muted);font-size:.85rem;margin:2px 0 8px}
.place{padding:8px 0;border-top:1px dashed var(--line)}
.place b{display:block}
.place span{color:var(--muted);font-size:.9rem}
.weather-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.wx{background:var(--paper);border-radius:10px;padding:6px 10px;font-size:.85rem}
.wx b{color:var(--text)}
a{color:var(--ink)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filter button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.85rem}
.filter button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* Mala e gastos */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--green)}
.check.done span{text-decoration:line-through;color:var(--muted)}
.check span{flex:1}
.progress{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 12px}
.progress i{display:block;height:100%;background:var(--green);transition:width .3s}
.form{display:grid;grid-template-columns:1fr 110px;gap:8px}
.form input,.form select,textarea{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:9px 10px;min-width:0;width:100%}
.form .full{grid-column:1/-1}
.total{font-family:var(--hand);font-size:2.4rem;color:var(--ink);line-height:1}
.exp{display:grid;grid-template-columns:1fr auto 30px;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:center}
.exp small{display:block;color:var(--muted)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.cats span{background:var(--paper);border-radius:8px;padding:3px 8px;font-size:.82rem}
textarea{min-height:140px;resize:vertical;line-height:1.5}
.empty{color:var(--muted);font-style:italic;padding:8px 0}

/* Navegação inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .wrap{display:flex;max-width:760px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:.74rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs button .ic{font-size:1.25rem;line-height:1.2}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--ink-wash)}
.status{font-size:.78rem;color:var(--muted);text-align:center;margin:14px 0 6px;min-height:1.2em}
.src{font-size:.78rem;color:var(--muted);margin-top:10px}
@media (max-width:420px){
  .note h1{font-size:2.2rem}
  .stop{grid-template-columns:24px 50px 1fr 26px}
  .add-row{grid-template-columns:76px 1fr auto}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

/* ---------- Utilidades ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function parseDate(iso){var p=iso.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function todayISO(){var n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");}
function toMin(t){var p=t.split(":");return +p[0]*60+ +p[1];}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});}
function fmtH(h){return h.toFixed(2).replace(".",",")+" m";}

/* ---------- Marés ---------- */
function tidePoints(iso){
  var arr = (TIDES[iso]||[]).map(function(r){return {m:toMin(r[0]),h:r[1],k:r[2]};});
  if(arr.length<2) return arr;
  var first=arr[0], second=arr[1], last=arr[arr.length-1], pen=arr[arr.length-2];
  arr.unshift({m:first.m-372,h:second.h,k:second.k,v:true});
  arr.push({m:last.m+372,h:pen.h,k:pen.k,v:true});
  return arr;
}
function levelAt(pts,m){
  for(var i=0;i<pts.length-1;i++){
    var a=pts[i],b=pts[i+1];
    if(m>=a.m && m<=b.m){
      var f=(m-a.m)/(b.m-a.m);
      return a.h+(b.h-a.h)*(1-Math.cos(Math.PI*f))/2;
    }
  }
  return null;
}
function tideSVG(iso){
  var pts=tidePoints(iso); if(!pts.length) return "";
  var W=320,H=96,top=10,bot=74,maxH=2.5;
  function y(h){return bot-(h/maxH)*(bot-top);}
  var d="",area="";
  for(var m=0;m<=1440;m+=15){
    var h=levelAt(pts,m); if(h===null) continue;
    var x=(m/1440)*W;
    d+=(d?"L":"M")+x.toFixed(1)+" "+y(h).toFixed(1);
  }
  area=d+"L"+W+" "+bot+"L0 "+bot+"Z";
  var marks="";
  pts.forEach(function(p){
    if(p.v||p.m<0||p.m>1440) return;
    var x=(p.m/1440)*W;
    marks+='<circle cx="'+x.toFixed(1)+'" cy="'+y(p.h).toFixed(1)+'" r="3.2" fill="'+(p.k==="L"?"var(--sea)":"var(--ink)")+'"/>';
  });
  var now=new Date(), nowM=now.getHours()*60+now.getMinutes(), nowLine="";
  if(iso===todayISO()){ var nx=(nowM/1440)*W; nowLine='<line x1="'+nx+'" x2="'+nx+'" y1="'+top+'" y2="'+bot+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="3 3"/>'; }
  var ticks="";
  [0,6,12,18,24].forEach(function(hh){var x=(hh*60/1440)*W;ticks+='<text x="'+Math.min(Math.max(x,8),W-10)+'" y="'+(H-6)+'" font-size="10" text-anchor="middle" fill="var(--muted)">'+hh+'h</text>';});
  var lim='<line x1="0" x2="'+W+'" y1="'+y(0.5)+'" y2="'+y(0.5)+'" stroke="var(--good)" stroke-width="1" stroke-dasharray="2 4" opacity=".7"/>';
  return '<svg class="tide-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Curva da maré do dia"><path d="'+area+'" fill="var(--sea)" opacity=".14"/><path d="'+d+'" fill="none" stroke="var(--sea)" stroke-width="2"/>'+lim+nowLine+marks+ticks+'</svg>';
}
function tideVerdict(iso){
  var lows=(TIDES[iso]||[]).filter(function(r){return r[2]==="L";});
  var day=lows.filter(function(r){var m=toMin(r[0]);return m>=360&&m<=960;});
  if(!day.length) return {ok:false,txt:"Sem baixa-mar durante o dia."};
  var best=day.reduce(function(a,b){return b[1]<a[1]?b:a;});
  var m=toMin(best[0]);
  function hm(x){return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");}
  if(best[1]<=0.5) return {ok:true,txt:"Boa para piscinas naturais: "+hm(m-60)+" às "+hm(m+60)+" (mínima "+fmtH(best[1])+" às "+best[0]+")."};
  if(best[1]<=0.7) return {ok:false,txt:"Maré no limite ("+fmtH(best[1])+" às "+best[0]+"): piscinas rasas podem não formar bem."};
  return {ok:false,txt:"Maré de quadratura ("+fmtH(best[1])+" às "+best[0]+"): piscinas naturais provavelmente não formam."};
}
function tideBox(iso,wx){
  if(!TIDES[iso]) return "";
  var v=tideVerdict(iso);
  var chips=TIDES[iso].map(function(r){return '<span class="tide-chip '+(r[2]==="L"?"low":"")+'">'+(r[2]==="L"?"▼ ":"▲ ")+r[0]+" · "+fmtH(r[1])+"</span>";}).join("");
  var ref = wx==="ce" ? "Referência: Porto de Maceió. Em Fortaleza os horários mudam; confira a tábua local antes de sair." : "Referência: Porto de Maceió (no litoral de AL a RN a diferença costuma ser de poucos minutos).";
  return '<div class="box sea"><h4>Maré</h4>'+tideSVG(iso)+'<div class="tide-list">'+chips+'</div><div class="verdict '+(v.ok?"good":"bad")+'">'+v.txt+'</div><div class="src">'+ref+'</div></div>';
}

  if(day.d===t) return "now";

function remindersPanel(){
  var t=todayISO(), now=new Date(), nowM=now.getHours()*60+now.getMinutes(), all=[];
  DAYS.forEach(function(d){ d.rem.forEach(function(r){ if(d.d>=t) all.push({day:d,r:r}); }); });
  all.sort(function(a,b){ var ka=a.day.d+(a.r.t||"99"), kb=b.day.d+(b.r.t||"99"); return ka<kb?-1:1; });

function icsFor(day,r){

      +'<div><div class="day-title">'+(day.star?'<span class="star" aria-label="destaque">✱</span> ':"")+esc(day.title)+'</div><div class="day-sub">'+esc(day.sub)+'</div>'+statusBadge(day,stt)+tags+(day.rem.length?'<span class="tag rem">⏰ '+day.rem.length+'</span>':'')+(day.obs?'<span class="tag obs">📝 obs.</span>':'')+'</div>'
      +'<span class="chev" aria-hidden="true">▾</span></button>'
      +'<div class="day-body"><div class="rename"><label>Nome do dia<input type="text" id="rt-'+day.d+'" value="'+esc(day.title)+'"></label><label>Descrição<input type="text" id="rs-'+day.d+'" value="'+esc(day.sub)+'"></label><button class="btn ghost" data-act="rename" data-d="'+day.d+'">Salvar nome</button></div><ul class="stops">'+stops+'</ul>'
      +'<div class="add-row"><input type="time" id="nt-'+day.d+'" aria-label="Horário"><input type="text" id="nx-'+day.d+'" placeholder="Novo compromisso" aria-label="Novo compromisso"><button class="btn" data-act="add" data-d="'+day.d+'">Adicionar</button></div>'
      +dayExtras(day,stt)
      +tips+tideBox(day.d,day.wx)+wxBox(day.wx)+'</div></article>';
  });
  return html;
}

function renderMares(){
  var rows=DAYS.map(function(day){
    var r=TIDES[day.d]||[]; var dt=parseDate(day.d); var v=tideVerdict(day.d);
    var lows=r.filter(function(x){return x[2]==="L";}).map(function(x){return x[0]+" ("+fmtH(x[1])+")";}).join("<br>");
    var highs=r.filter(function(x){return x[2]==="H";}).map(function(x){return x[0]+" ("+fmtH(x[1])+")";}).join("<br>");
    var minL=r.filter(function(x){return x[2]==="L";}).reduce(function(a,b){return Math.min(a,b[1]);},9);
    var pct=Math.max(6,Math.min(100,(1-minL/1.1)*100));
    return '<tr><td><b>'+dt.getDate()+'/'+(dt.getMonth()+1)+'</b> '+WD[dt.getDay()]+'<br><span style="color:var(--muted);font-size:.8rem">'+esc(day.title)+'</span></td><td>'+lows+'</td><td>'+highs+'</td><td><div class="bar" title="Quanto mais cheia, melhor para piscinas naturais"><i style="width:'+pct.toFixed(0)+'%"></i></div><div class="verdict '+(v.ok?"good":"bad")+'" style="font-size:.78rem;font-weight:600">'+(v.ok?"Boa":"Fraca")+'</div></td></tr>';
  }).join("");
  return '<h2 class="section">Tábua de marés</h2><p class="lead">Piscinas naturais (Pajuçara, Galés, Porto de Galinhas, Picãozinho) aparecem com a maré abaixo de ~0,5 m. De 18 a 21/09 a lua está em quarto crescente e as marés ficam fracas; a partir de 24/09 melhoram, com o auge perto da lua cheia (26 a 28/09).</p>'
   +'<div class="panel scroll"><table class="tide-table"><thead><tr><th>Dia</th><th>Baixa-mar</th><th>Preamar</th><th>Piscinas</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<p class="src">Fonte: Porto de Maceió. 18–21/09 pela Tábua de Marés da Marinha do Brasil (CHM); demais dias pela previsão do TemperaturaDoMar. Não serve para navegação. Para Fortaleza, confira a tábua local.</p>'
   +'<div class="box sea"><h4>Como aproveitar</h4><ul><li>Os passeios de jangada saem cerca de 1 h antes da maré mínima.</li><li>Use sapatilha, não pise nos corais e não alimente os peixes.</li><li>Confirme sempre com a operadora no dia anterior: vento e chuva também cancelam passeios.</li></ul></div>';
}

function renderMala(){
  var done=state.pack.filter(function(p){return p.done;}).length, tot=state.pack.length;
  var items=state.pack.map(function(p){return '<label class="check'+(p.done?" done":"")+'"><input type="checkbox" data-act="ptog" data-id="'+p.id+'" '+(p.done?"checked":"")+'><span>'+esc(p.x)+'</span><button class="del" data-act="pdel" data-id="'+p.id+'" aria-label="Remover">×</button></label>';}).join("") || '<div class="empty">Lista vazia. Adicione o primeiro item abaixo.</div>';
  return '<h2 class="section">Mala</h2><p class="lead">'+done+' de '+tot+' itens separados.</p><div class="progress"><i style="width:'+(tot?done/tot*100:0)+'%"></i></div>'
   +'<div class="panel">'+items+'<div class="add-row" style="grid-template-columns:1fr auto"><input type="text" id="pnew" placeholder="Novo item" aria-label="Novo item"><button class="btn" data-act="padd">Adicionar</button></div></div>'

function renderGastos(){
  var total=state.exp.reduce(function(a,e){return a+e.v;},0);
  var cats={}; state.exp.forEach(function(e){cats[e.c]=(cats[e.c]||0)+e.v;});
  var catHtml=Object.keys(cats).map(function(k){return '<span>'+esc(k)+': <b>'+brl(cats[k])+'</b></span>';}).join("");
  var list=state.exp.slice().reverse().map(function(e){return '<div class="exp"><div>'+esc(e.x)+'<small>'+esc(e.c)+' · '+esc(e.d)+'</small></div><b>'+brl(e.v)+'</b><button class="del" data-act="edel" data-id="'+e.id+'" aria-label="Remover">×</button></div>';}).join("") || '<div class="empty">Nenhum gasto ainda. Registre o primeiro acima.</div>';
  var dayOpts=DAYS.map(function(d){var dt=parseDate(d.d);return '<option value="'+dt.getDate()+'/'+(dt.getMonth()+1)+'">'+dt.getDate()+'/'+(dt.getMonth()+1)+' · '+esc(d.title)+'</option>';}).join("");
  return '<h2 class="section">Gastos</h2><div class="panel"><div style="color:var(--muted);font-size:.85rem">Total da viagem</div><div class="total">'+brl(total)+'</div><div class="cats">'+catHtml+'</div></div>'
   +'<div class="panel"><div class="form"><input id="ex" placeholder="Descrição (ex.: jangada)" aria-label="Descrição"><input id="ev" type="number" inputmode="decimal" step="0.01" min="0" placeholder="R$" aria-label="Valor">'
   +'<select id="ec" aria-label="Categoria"><option>Alimentação</option><option>Combustível</option><option>Hospedagem</option><option>Passeios</option><option>Compras</option><option>Pedágio/Estacionamento</option><option>Outros</option></select>'
   +'<select id="ed" aria-label="Dia">'+dayOpts+'</select><button class="btn full" data-act="eadd">Registrar gasto</button></div></div>'
   +'<div class="panel">'+list+'</div>';
}

/* ---------- Montagem ---------- */
function daysUntil(){
  var s=parseDate("2026-09-18"), n=parseDate(todayISO());
  return Math.round((s-n)/86400000);
}
function heroPill(){
  var du=daysUntil(), end=parseDate("2026-10-01"), n=parseDate(todayISO());
  if(du>1) return "Faltam "+du+" dias";
  if(du===1) return "É amanhã!";
  if(n<=end){ var d=DAYS.filter(function(x){return x.d===todayISO();})[0]; return d?"Hoje: "+d.title:"Viagem em andamento"; }
  return "Viagem concluída";
}
function render(){
  var root=document.getElementById("root");
  var tabs=[["roteiro","Roteiro","🗓️"],["mares","Marés","🌊"],["dicas","Passeios","🧭"],["mala","Mala","🎒"],["gastos","Gastos","💰"]];
  var views={roteiro:renderRoteiro,mares:renderMares,dicas:renderDicas,mala:renderMala,gastos:renderGastos};
  root.innerHTML='<header class="hero"><div class="hero-inner"><button class="theme-btn" data-act="theme">Tema</button><div class="note"><h1>Aventura dos Soares</h1><p>Nossa viagem pelo Nordeste</p></div><div class="count"><span class="pill">18/09 a 01/10/2026</span><button class="pill" data-act="savenow" style="cursor:pointer">Salvar agora</button><span class="pill">'+esc(heroPill())+'</span></div></div></header>'
   +'<main><section class="view on">'+views[ui.tab]()+'</section><div class="status" id="status" aria-live="polite"></div></main>'
   +'<nav class="tabs" aria-label="Seções"><div class="wrap" role="tablist">'+tabs.map(function(t){return '<button role="tab" data-act="tab" data-k="'+t[0]+'" aria-selected="'+(ui.tab===t[0])+'"><span class="ic" aria-hidden="true">'+t[2]+'</span>'+t[1]+'</button>';}).join("")+'</div></nav>';
}
function findDay(d){return DAYS.filter(function(x){return x.d===d;})[0];}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]"); if(!el) return;
  var a=el.dataset.act, d=el.dataset.d, id=el.dataset.id;
  if(a==="savenow"){ clearTimeout(pubTimer); pubTimer=null; persist(); clearTimeout(pubTimer); pubTimer=null; if(artifactApi&&writable){publishNow();}else{setStatus("Salvo neste aparelho ✓");} return; }
  if(a==="rename"){var rd=findDay(d);var nt=document.getElementById("rt-"+d).value.trim();var ns=document.getElementById("rs-"+d).value.trim();if(!nt){document.getElementById("rt-"+d).focus();return;}rd.title=nt;rd.sub=ns;ui.open[d]=true;persist();render();setStatusSoon("Nome salvo");return;}
  if(a==="herosave"){var hl=document.getElementById("heroline").value.trim();if(!hl)return;state.heroLine=hl;persist();render();setStatusSoon("Cidades do topo salvas");return;}
  if(a==="radd"){var tx2=document.getElementById("rmx-"+d),tt2=document.getElementById("rmt-"+d);if(!tx2.value.trim()){tx2.focus();return;}findDay(d).rem.push({id:uid(),t:tt2.value,x:tx2.value.trim()});ui.open[d]=true;persist();render();return;}
  if(a==="rdel"){var rd2=findDay(d);rd2.rem=rd2.rem.filter(function(r){return r.id!==id;});persist();render();return;}
  if(a==="daydone"){var dd=findDay(d);dd.doneManual=!dd.doneManual;ui.open[d]=true;persist();render();return;}
  if(a==="ics"){var dy3=findDay(d),r3=dy3.rem.filter(function(r){return r.id===id;})[0];if(!r3)return;
    if(!dlApi){try{var bl=new Blob([icsFor(dy3,r3)],{type:"text/calendar"});var au=URL.createObjectURL(bl);var an=document.createElement("a");an.href=au;an.download="lembrete-"+d+".ics";document.body.appendChild(an);an.click();an.remove();setTimeout(function(){URL.revokeObjectURL(au);},4000);setStatus("Lembrete baixado ✓ Abra o arquivo para adicionar à agenda.");}catch(e){setStatus("Não foi possível baixar o lembrete neste navegador");}return;}
    dlApi.save({filename:"lembrete-"+d+".ics",data:icsFor(dy3,r3)}).then(function(){setStatus("Lembrete baixado ✓ Abra o arquivo para adicionar à agenda.");}).catch(function(err){var c=err&&err.code;setStatus(c==="declined"?"Download cancelado":"Não foi possível baixar o lembrete agora");});return;}
  if(a==="tab"){ui.tab=el.dataset.k;render();window.scrollTo(0,0);return;}
  if(a==="open"){var day=document.getElementById("day-"+d);var o=!day.classList.contains("open");ui.open[d]=o;day.classList.toggle("open",o);el.setAttribute("aria-expanded",o);return;}
  if(a==="filter"){ui.cityFilter=el.dataset.k;render();return;}
  if(a==="theme"){var r=document.documentElement;var cur=r.getAttribute("data-theme");var dark=cur?cur==="dark":window.matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",dark?"light":"dark");try{localStorage.setItem("viagem-ne-theme",dark?"light":"dark");}catch(e){}return;}
  if(a==="del"){var dy=findDay(d);dy.stops=dy.stops.filter(function(s){return s.id!==id;});persist();render();return;}
  if(a==="add"){
    var tx=document.getElementById("nx-"+d), tt=document.getElementById("nt-"+d);
    if(!tx.value.trim()){tx.focus();return;}
    findDay(d).stops.push(S(tt.value,tx.value.trim()));ui.open[d]=true;persist();render();
    var n=document.getElementById("nx-"+d); if(n) n.focus(); return;
  }
  if(a==="pdel"){ev.preventDefault();state.pack=state.pack.filter(function(p){return p.id!==id;});persist();render();return;}
  if(a==="padd"){var pn=document.getElementById("pnew");if(!pn.value.trim()){pn.focus();return;}state.pack.push({id:uid(),x:pn.value.trim(),done:false});persist();render();document.getElementById("pnew").focus();return;}
  if(a==="edel"){state.exp=state.exp.filter(function(e){return e.id!==id;});persist();render();return;}
  if(a==="eadd"){
    var ex=document.getElementById("ex"), evv=document.getElementById("ev");
    var v=parseFloat(String(evv.value).replace(",","."));
    if(!ex.value.trim()){ex.focus();return;} if(!(v>0)){evv.focus();return;}
    state.exp.push({id:uid(),x:ex.value.trim(),v:v,c:document.getElementById("ec").value,d:document.getElementById("ed").value});
    persist();render();return;
  }
});
document.addEventListener("change",function(ev){
  var el=ev.target; var a=el.dataset&&el.dataset.act;
  if(a==="tog"){var dy=findDay(el.dataset.d);dy.stops.forEach(function(s){if(s.id===el.dataset.id)s.done=el.checked;});persist();render();}
  if(a==="ptog"){state.pack.forEach(function(p){if(p.id===el.dataset.id)p.done=el.checked;});persist();render();}
  if(el.id==="notes"){state.notes=el.value;persist();}
});
var noteTimer=null;
document.addEventListener("input",function(ev){
  var od=ev.target.dataset&&ev.target.dataset.obs;
  if(od){ findDay(od).obs=ev.target.value; clearTimeout(noteTimer); noteTimer=setTimeout(persist,800); return; }
  if(ev.target.id!=="notes") return;
  state.notes=ev.target.value;
  clearTimeout(noteTimer);
  noteTimer=setTimeout(persist,800);
});
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter"||!ev.target.id) return;
  var id=ev.target.id;
  if(id.indexOf("nx-")===0){var b=document.querySelector('[data-act="add"][data-d="'+id.slice(3)+'"]');if(b)b.click();}
  if(id.indexOf("rt-")===0||id.indexOf("rs-")===0){var rb=document.querySelector('[data-act="rename"][data-d="'+id.slice(3)+'"]');if(rb)rb.click();}
  if(id.indexOf("rmx-")===0){var rb2=document.querySelector('[data-act="radd"][data-d="'+id.slice(4)+'"]');if(rb2)rb2.click();}
  if(id==="pnew"){document.querySelector('[data-act="padd"]').click();}
});

try{var th=localStorage.getItem("viagem-ne-theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
try{var su=JSON.parse(sessionStorage.getItem("viagem-ne-ui")||"null");if(su){ui=su;}sessionStorage.removeItem("viagem-ne-ui");}catch(e){}
window.addEventListener("beforeunload",function(){ if(pubTimer){ clearTimeout(pubTimer); publishNow(); } });
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="hidden" && pubTimer){ clearTimeout(pubTimer); pubTimer=null; publishNow(); } });
render();
})();
