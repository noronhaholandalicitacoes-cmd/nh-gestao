<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a" id="meta-tema">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NH Viabilidade">
<link rel="manifest" href="manifest-viabilidade.json">
<title>NH — Viabilidade</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a; --s1:#111725; --s2:#161d2e; --s3:#1c2438;
  --b1:#252d40; --b2:#303a52;
  --nh:#f97316; --nha:rgba(249,115,22,.12);
  --g1:#22c55e; --r1:#ef4444; --y1:#eab308; --b_:#3b82f6;
  --t1:#f5f5f5; --t2:#a3a3a3; --t3:#8b95a1;
  --nh2:#fb923c;
}
body{
  --surf:var(--s1); --surf2:var(--s2); --line:var(--b1); --line2:var(--b2);
  --txt:var(--t1); --txt2:var(--t2); --txt3:var(--t3);
  --sim:var(--g1); --nao:var(--r1); --ana:var(--y1); --blue:var(--b_);
}
body.light-theme{
  --bg:#f2f5fc; --s1:#ffffff; --s2:#eef2fb; --s3:#e2e9f8;
  --b1:#d9e1f2; --b2:#b6c4e6;
  --nh:#f4560a; --nha:rgba(244,86,10,.12);
  --g1:#00a86b; --r1:#f0284a; --y1:#e59500; --b_:#2563eb;
  --t1:#0b1220; --t2:#3d4a66; --t3:#64748b;
  --nh2:#ff7a1a;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(1200px 500px at 50% -10%,rgba(249,115,22,.08),transparent 70%);pointer-events:none;z-index:0}

.header{background:rgba(10,10,10,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:11px;min-width:0}
.logo-mark{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#000;flex-shrink:0;box-shadow:0 4px 14px rgba(249,115,22,.35)}
.logo-info{min-width:0}
.logo-info .title{font-size:16px;font-weight:800;color:var(--txt);letter-spacing:-.02em}
.logo-info .sub{font-size:11px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:1px}
.badge-pend{background:linear-gradient(135deg,rgba(249,115,22,.2),rgba(249,115,22,.08));color:var(--nh2);border:1px solid rgba(249,115,22,.35);padding:7px 14px;border-radius:22px;font-size:12px;font-weight:800;white-space:nowrap;flex-shrink:0}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:13px;padding:16px 18px 8px;position:relative;z-index:1}
.stat{
  background:linear-gradient(90deg,var(--accent,var(--t3)),transparent 55%) top left/100% 2px no-repeat,var(--s2);
  border:1px solid var(--b1);border-left:4px solid var(--accent,var(--b2));
  border-radius:12px;padding:20px 19px;min-width:0;
  position:relative;overflow:hidden;
  transition:transform .15s ease,box-shadow .15s ease;
  cursor:pointer;-webkit-user-select:none;user-select:none;
}
.stat:hover{transform:translateY(-2px);border-color:var(--accent,var(--b2))}
.stat:focus-visible{outline:2px solid var(--accent,var(--nh));outline-offset:2px}
.stat.on{
  background:linear-gradient(90deg,var(--accent,var(--t3)),transparent 55%) top left/100% 3px no-repeat,var(--s3);
  border-color:var(--accent,var(--b2));
  box-shadow:0 0 0 1px var(--accent,var(--b2)),0 8px 24px rgba(0,0,0,.35);
}
.stat.s-t{--accent:var(--nh)} .stat.s-p{--accent:var(--t3)} .stat.s-a{--accent:var(--ana)} .stat.s-s{--accent:var(--sim)} .stat.s-n{--accent:var(--nao)}
.stat-l{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:9px}
.stat-n{font-size:32px;font-weight:800;line-height:1;font-family:'JetBrains Mono',monospace;letter-spacing:-1px;position:relative;z-index:1}

@media(max-width:620px){
  .stats{grid-template-columns:1fr 1fr;gap:10px;padding:14px 14px 8px}
  .stat{padding:15px 14px}
  .stat-l{margin-bottom:7px}
  .stat-n{font-size:25px}
  .stat.s-p{grid-column:1/-1;order:-1;padding:18px 16px}
  .stat.s-p .stat-n{font-size:38px}
}

.filtros-wrap{padding:0 18px;display:flex;flex-direction:column;gap:12px;position:relative;z-index:1}
.filtros-wrap.tem-filtro{padding:8px 18px 14px}
.filtros-row{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filtros-row::-webkit-scrollbar{display:none}
.filtro-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;font-weight:700}
.f-btn{background:var(--surf);border:1px solid var(--line);color:var(--txt2);padding:9px 16px;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:Outfit,sans-serif;transition:all .18s;flex-shrink:0}
.f-btn:active{transform:scale(.95)}
.f-btn.on{background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(249,115,22,.08));border-color:rgba(249,115,22,.45);color:var(--nh2)}
.f-btn .pt{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rc);margin-right:7px;vertical-align:middle}

.cards{padding:4px 18px 120px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border .2s,transform .2s,box-shadow .2s;position:relative}
.card::after{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,#3b82f6,#a855f7,var(--nh));z-index:1}
.card::before{content:"";position:absolute;left:0;top:4px;bottom:0;width:4px;background:var(--txt3);opacity:.5}
.card.sim::before{background:linear-gradient(180deg,var(--sim),#16a34a);opacity:1}
.card.nao::before{background:linear-gradient(180deg,var(--nao),#dc2626);opacity:1}
.card.analise::before{background:linear-gradient(180deg,var(--ana),#ca8a04);opacity:1}
.card.sim{border-color:rgba(34,197,94,.3)}
.card.nao{border-color:rgba(239,68,68,.3)}
.card.analise{border-color:rgba(234,179,8,.35);box-shadow:0 0 0 1px rgba(234,179,8,.12),0 6px 20px rgba(234,179,8,.06)}

.card-head{padding:18px 18px 12px 22px}
.card-top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card-emp{font-size:12px;font-weight:800;padding:5px 13px;border-radius:20px;flex-shrink:0;letter-spacing:.02em}
.tag-resp{display:inline-flex;align-items:center;gap:7px;border-radius:20px;padding:3px 12px 3px 3px;flex-shrink:0;max-width:100%;background:var(--rcb);border:1px solid var(--rcl)}
.tag-resp .ini{width:21px;height:21px;border-radius:50%;flex-shrink:0;background:var(--rcl);color:var(--rc);font-size:9px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;justify-content:center}
.tag-resp .nm{font-size:11.5px;font-weight:700;color:var(--rc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.status-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 13px;border-radius:20px;font-size:12.5px;font-weight:700;flex-shrink:0;margin-left:auto}
.s-sim{background:rgba(34,197,94,.15);color:var(--sim)}
.s-nao{background:rgba(239,68,68,.15);color:var(--nao)}
.s-analise{background:rgba(234,179,8,.15);color:var(--ana)}
.s-analise .dot{width:7px;height:7px;border-radius:50%;background:var(--ana);animation:pulse 1.2s ease-in-out infinite}
.s-pend{background:rgba(120,120,130,.1);color:var(--txt3);border:1px solid var(--line)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.25)}}

.card-licit{font-size:16px;font-weight:700;color:var(--txt);line-height:1.5;letter-spacing:-.01em}
.card-meta{padding:0 18px 14px 22px;display:flex;flex-wrap:wrap;gap:8px}
.meta-tag{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:13px;color:var(--txt2);display:inline-flex;align-items:center;gap:5px}
.meta-tag.val{color:var(--nh2);border-color:rgba(249,115,22,.25);font-weight:700}

.empty{text-align:center;padding:60px 20px;color:var(--txt3)}
.empty-ico{font-size:48px;margin-bottom:12px}
#toast{display:none;position:fixed;bottom:20px;left:20px;right:20px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px;font-weight:600;z-index:1000;text-align:center;animation:slide-up .3s ease}
#toast.ok{background:rgba(34,197,94,.15);color:var(--g1);border-color:rgba(34,197,94,.3)}
#toast.err{background:rgba(239,68,68,.15);color:var(--r1);border-color:rgba(239,68,68,.3)}
@keyframes slide-up{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}

.card-footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-footer button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surf2);color:var(--txt2);font-weight:600;cursor:pointer;transition:all .18s;font-size:12px}
.card-footer button:hover{background:var(--s3);color:var(--txt)}
.card-footer input{flex:1;min-width:200px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-family:Outfit,sans-serif;font-size:12px}
.card-footer input:focus{outline:none;border-color:var(--nh);box-shadow:0 0 0 3px rgba(249,115,22,.1)}
.btn-salvar{background:rgba(34,197,94,.2);color:var(--g1);border-color:rgba(34,197,94,.35)!important}
.btn-salvar.ativo{background:rgba(34,197,94,.3);cursor:pointer}
.btn-salvar:disabled{opacity:.5;cursor:not-allowed}
.aviso{display:none;padding:8px 12px;background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.35);border-radius:6px;font-size:11px;color:var(--y1);margin-top:6px}
#main-content{flex:1;min-height:0;overflow-y:auto}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">NH</div>
    <div class="logo-info">
      <div class="title">NH — Viabilidade</div>
      <div class="sub">Análise de participação</div>
    </div>
  </div>
  <div class="badge-pend" id="badge-pend">0 p/ avaliar</div>
</div>

<div id="ac-login" style="position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999">
  <div style="background:var(--s1);border:1px solid var(--b1);border-radius:20px;padding:32px;max-width:360px;width:90%">
    <div style="font-size:20px;font-weight:800;color:var(--txt);margin-bottom:6px">Entrar em Viabilidade</div>

    <div style="margin-bottom:14px">
      <input id="lg-wpp" type="tel" placeholder="(83) 99850-9855" style="width:100%;padding:12px;background:var(--s2);border:1px solid var(--b1);border-radius:10px;color:var(--txt);font-family:Outfit,sans-serif;font-size:14px">
    </div>
    <div style="margin-bottom:20px">
      <input id="lg-senha" type="password" placeholder="Senha" style="width:100%;padding:12px;background:var(--s2);border:1px solid var(--b1);border-radius:10px;color:var(--txt);font-family:Outfit,sans-serif;font-size:14px">
    </div>
    <div id="ac-err" style="display:none;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.35);color:var(--r1);padding:12px;border-radius:8px;margin-bottom:16px;font-size:12px"></div>
    <button id="lg-btn" onclick="entrar()" style="width:100%;padding:12px;background:var(--nh);color:#000;border:none;border-radius:10px;font-weight:800;cursor:pointer;font-size:14px">Entrar</button>
  </div>
</div>

<div id="main-content" style="display:none">
  <div class="stats" id="filtros-status">
    <div class="stat s-t" role="button" tabindex="0" data-f="total"><div class="stat-l">Total</div><div class="stat-n" id="st-total">—</div></div>
    <div class="stat s-p" role="button" tabindex="0" data-f="pendente"><div class="stat-l">Pendentes</div><div class="stat-n" id="st-pend">—</div></div>
    <div class="stat s-a" role="button" tabindex="0" data-f="analise"><div class="stat-l">Em Análise</div><div class="stat-n" id="st-ana">—</div></div>
    <div class="stat s-s" role="button" tabindex="0" data-f="sim"><div class="stat-l">Participar</div><div class="stat-n" id="st-sim">—</div></div>
    <div class="stat s-n" role="button" tabindex="0" data-f="nao"><div class="stat-l">Recusado</div><div class="stat-n" id="st-nao">—</div></div>
  </div>
  
  <div class="filtros-wrap">
    <div id="linha-resp" style="display:none">
      <div class="filtro-label">Responsável</div>
      <div class="filtros-row" id="filtros-resp"></div>
    </div>
    <div id="linha-emp" style="display:none">
      <div class="filtro-label">Empresa</div>
      <div class="filtros-row" id="filtros-emp"></div>
    </div>
  </div>

  <div id="cards-container"></div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js"></script>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   CONFIGURAÇÃO FIREBASE — COPIE SUAS CREDENCIAIS AQUI
   
   Obtenha em: Firebase Console > Project Settings > Web App Config
   ═══════════════════════════════════════════════════════════════════════ */

const firebaseConfig={
  apiKey:"YOUR_API_KEY_HERE",
  authDomain:"YOUR_AUTH_DOMAIN_HERE",
  projectId:"YOUR_PROJECT_ID_HERE",
  storageBucket:"YOUR_STORAGE_BUCKET_HERE",
  messagingSenderId:"YOUR_MESSAGING_SENDER_ID_HERE",
  appId:"YOUR_APP_ID_HERE"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);

// ⚠️ AGUARDAR: Não usar auth/db antes desta linha
const auth=firebase.auth();
const db=firebase.firestore();

console.log('✅ Firebase inicializado com sucesso');

/* ═══════════════════════════════════════════════════════════════════════
   VARIÁVEIS GLOBAIS
   ═══════════════════════════════════════════════════════════════════════ */

var TODOS=[],ANALISES_VIAB={},RESPS_CAD={},_canon=null;
var FILTRO_STATUS='pendente',FILTRO_RESP='todos',FILTRO_EMP='todos';
var EMP_CORES={
  'SOS':'#22c55e',
  'SOS FILIAL':'#3b82f6',
  'ONLAV':'#a855f7',
  'ENGAGED':'#f59e0b',
  'VISE':'#ec4899',
  'SAUTEC':'#06b6d4'
};
var _pendentes={};

/* ═══════════════════════════════════════════════════════════════════════
   FUNÇÕES AUXILIARES
   ═══════════════════════════════════════════════════════════════════════ */

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function normTxt(s){
  return String(s||'')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .toUpperCase()
    .trim();
}

function tituloCaso(s){
  return String(s||'').toLowerCase().split(/\s+/).map(function(p){
    return p?p.charAt(0).toUpperCase()+p.slice(1):p;
  }).join(' ');
}

function iniciais(nome){
  var p=String(nome||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length)return '—';
  if(1===p.length)return p[0].substring(0,2).toUpperCase();
  return (p[0].charAt(0)+p[p.length-1].charAt(0)).toUpperCase();
}

/* Separa responsáveis: "A & B" → ["A", "B"] */
function partesResp(valor){
  return String(valor||'')
    .split(/\s*[&\/;+]\s*/)
    .map(function(s){return s.trim();})
    .filter(Boolean);
}

var TONS_RESP=[205,230,255,280,305,330,175,155,265,195,290,140];
function corResp(nome){
  var s=normTxt(nome),h=0;
  for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;
  var t=TONS_RESP[h%TONS_RESP.length];
  return {
    cor:'hsl('+t+',62%,64%)',
    bg:'hsla('+t+',62%,64%,.12)',
    leve:'hsla('+t+',62%,64%,.24)'
  };
}

function construirCanonicos(){
  var brutos={};
  TODOS.forEach(function(d){
    partesResp(d.arr[9]).forEach(function(p){brutos[p]=true;});
  });
  var cad=[],mapa={},grupos=[];
  Object.keys(brutos).forEach(function(b){
    var nb=normTxt(b),i;
    for(i=0;i<cad.length;i++){
      var nc=normTxt(cad[i]);
      if(nc.length<3||nb.length<3)continue;
      if(-1!==nb.indexOf(nc)||-1!==nc.indexOf(nb)){mapa[b]=cad[i];return;}
    }
    for(i=0;i<grupos.length;i++){
      var g=grupos[i];
      if(-1!==nb.indexOf(g.norm)||-1!==g.norm.indexOf(nb)){
        if(nb.length<g.norm.length){g.norm=nb;g.canon=tituloCaso(b);}
        g.membros.push(b);return;
      }
    }
    grupos.push({norm:nb,canon:tituloCaso(b),membros:[b]});
  });
  grupos.forEach(function(g){
    g.membros.forEach(function(m){if(!mapa[m])mapa[m]=g.canon;});
  });
  return mapa;
}

function respsDoEdital(valor){
  var partes=partesResp(valor);
  if(!partes.length)return [];
  if(!_canon)_canon=construirCanonicos();
  var saida=[],ja={};
  partes.forEach(function(p){
    var nome=_canon[p]||tituloCaso(p);
    if(ja[nome])return;
    ja[nome]=true;
    saida.push({nome:nome,c:corResp(nome)});
  });
  return saida;
}

function tagResponsavel(valor){
  var lista=respsDoEdital(valor);
  if(!lista.length)return '';
  return lista.slice(0,2).map(function(r){
    return '<span class="tag-resp" style="--rc:'+r.c.cor+';--rcb:'+r.c.bg+';--rcl:'+r.c.leve+'">'
      +'<span class="ini">'+esc(iniciais(r.nome))+'</span>'
      +'<span class="nm">'+esc(r.nome)+'</span></span>';
  }).join('')+(lista.length>2
    ?'<span class="tag-resp" style="--rc:var(--txt3);--rcb:transparent;--rcl:var(--line2)"><span class="nm">+'+(lista.length-2)+'</span></span>'
    :'');
}

function parseMoeda(v){
  var s=String(v||'').replace(/R\$\s*/g,'').replace(/\s/g,'').trim();
  if(!s) return 0;
  if(s.indexOf(',')!==-1) s=s.replace(/\./g,'').replace(',','.');
  else s=s.replace(/[^\d.]/g,'');
  return parseFloat(s)||0;
}

function fmtMoeda(n){
  if(!n) return '';
  return 'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function isAnalise(p){var s=String(p||'').toUpperCase().trim();return s==='EM ANÁLISE'||s==='EM ANALISE'||s==='ANÁLISE'||s==='ANALISE';}
function isSim(p){return String(p||'').toUpperCase().trim()==='SIM';}
function isNao(p){var s=String(p||'').toUpperCase().trim();return s==='NÃO'||s==='NAO';}

function toast(msg,tipo){
  var t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+(tipo||'ok');
  t.style.display='block';
  setTimeout(function(){t.style.display='none';},2500);
}

/* ═══════════════════════════════════════════════════════════════════════
   FILTROS — CORREÇÃO DO BUG DO RESPONSÁVEL
   ═══════════════════════════════════════════════════════════════════════ */

/* ✅ CORREÇÃO: Agora separa responsáveis e compara nome a nome */
function getFiltrados(){
  return TODOS.filter(function(d){
    var part=String(d.arr[10]||'').toUpperCase().trim();
    var respRaw=String(d.arr[9]||'').trim();
    var emp=String(d.arr[2]||'').trim();
    
    /* Status */
    if(FILTRO_STATUS==='pendente' && (part!=='' && !isAnalise(part))) return false;
    if(FILTRO_STATUS==='pendente' && isAnalise(part)) return false;
    if(FILTRO_STATUS==='analise' && !isAnalise(part)) return false;
    if(FILTRO_STATUS==='sim' && !isSim(part)) return false;
    if(FILTRO_STATUS==='nao' && !isNao(part)) return false;
    
    /* Responsável — COMPARAÇÃO CORRIGIDA */
    if(FILTRO_RESP!=='todos'){
      var respsDo=respsDoEdital(respRaw);
      var temResp=respsDo.some(function(r){
        return normTxt(r.nome)===normTxt(FILTRO_RESP);
      });
      if(!temResp) return false;
    }
    
    /* Empresa */
    if(FILTRO_EMP!=='todos' && emp!==FILTRO_EMP) return false;
    
    return true;
  });
}

function atualizarStats(){
  var pend=TODOS.filter(function(d){var p=String(d.arr[10]||'').trim();return !p;}).length;
  var ana=TODOS.filter(function(d){return isAnalise(d.arr[10]);}).length;
  var sim=TODOS.filter(function(d){return isSim(d.arr[10]);}).length;
  var nao=TODOS.filter(function(d){return isNao(d.arr[10]);}).length;
  document.getElementById('st-total').textContent=TODOS.length;
  document.getElementById('st-pend').textContent=pend;
  document.getElementById('st-ana').textContent=ana;
  document.getElementById('st-sim').textContent=sim;
  document.getElementById('st-nao').textContent=nao;
  var acao=pend+ana;
  document.getElementById('badge-pend').textContent=acao+' p/ avaliar';
}

function buildFiltrosResp(){
  var nomes={};
  TODOS.forEach(function(d){
    respsDoEdital(d.arr[9]).forEach(function(r){nomes[r.nome]=true;});
  });
  var lista=Object.keys(nomes).sort(function(a,b){return a.localeCompare(b,'pt-BR');});
  var wrap=document.getElementById('filtros-resp');
  wrap.innerHTML='';
  if(lista.length<2){
    FILTRO_RESP='todos';
    document.getElementById('linha-resp').style.display='none';
    return;
  }
  document.getElementById('linha-resp').style.display='';
  document.querySelector('.filtros-wrap').classList.add('tem-filtro');
  lista.forEach(function(nome){
    var btn=document.createElement('button');
    btn.className='f-btn';
    btn.innerHTML='<span class="pt" style="--rc:'+corResp(nome).cor+'"></span>'+esc(nome);
    btn.onclick=function(){setFiltroResp(nome,btn);};
    wrap.appendChild(btn);
  });
}

function buildFiltrosEmpresas(){
  var emps={};
  TODOS.forEach(function(d){var e=String(d.arr[2]||'').trim();if(e)emps[e]=true;});
  var chaves=Object.keys(emps).sort();
  var wrap=document.getElementById('filtros-emp');
  wrap.innerHTML='';
  if(chaves.length<2){
    FILTRO_EMP='todos';
    document.getElementById('linha-emp').style.display='none';
    return;
  }
  document.getElementById('linha-emp').style.display='';
  document.querySelector('.filtros-wrap').classList.add('tem-filtro');
  chaves.forEach(function(emp){
    var btn=document.createElement('button');
    btn.className='f-btn';
    btn.textContent=emp;
    btn.setAttribute('data-emp',emp);
    btn.onclick=function(){setFiltroEmp(emp,btn);};
    wrap.appendChild(btn);
  });
}

function setFiltroStatus(f){
  FILTRO_STATUS=f;
  document.querySelectorAll('#filtros-status .stat').forEach(function(c){
    c.classList.toggle('on',c.getAttribute('data-f')===f);
    c.setAttribute('aria-pressed',c.getAttribute('data-f')===f?'true':'false');
  });
  renderizar();
}

function setFiltroResp(f,btn){
  FILTRO_RESP=f;
  document.querySelectorAll('#filtros-resp .f-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  renderizar();
}

function setFiltroEmp(f,btn){
  FILTRO_EMP=f;
  document.querySelectorAll('#filtros-emp .f-btn').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  renderizar();
}

function renderCard(d){
  var arr=d.arr;
  var id=d.id;
  var emp=String(arr[2]||'').trim();
  var licit=String(arr[3]||'').trim();
  var val=parseMoeda(arr[7]);
  var part=String(arr[10]||'').toUpperCase().trim();
  var just=String(arr[12]||'').trim();

  var empCor=EMP_CORES[emp]||'#f97316';
  var cardCls=isSim(part)?'sim':isNao(part)?'nao':isAnalise(part)?'analise':'';
  var tagResp=tagResponsavel(arr[9]);

  var pill='<span class="status-pill s-pend">— Pendente</span>';
  if(isSim(part)) pill='<span class="status-pill s-sim">✓ Participar</span>';
  else if(isNao(part)) pill='<span class="status-pill s-nao">✕ Recusado</span>';
  else if(isAnalise(part)) pill='<span class="status-pill s-analise"><span class="dot"></span>Em Análise</span>';

  var temPart = part!=='';
  var justDisabled = !temPart ? 'disabled' : '';

  return '<div class="card '+cardCls+'" id="card-'+id+'">'+
    '<div class="card-head">'+
      '<div class="card-licit">'+esc(licit)+'</div>'+
      '<div class="card-meta">'+
        '<span class="meta-tag" style="background:'+empCor+'22;color:'+empCor+'">'+esc(emp)+'</span>'+
        '<span class="meta-tag val">'+fmtMoeda(val)+'</span>'+
      '</div>'+
      '<div class="card-top-row">'+tagResp+pill+'</div>'+
    '</div>'+
    '<div class="card-footer">'+
      '<button onclick="document.getElementById(\'sel-'+id+'\').value=\'SIM\';atualizarCard(\''+id+'\',\'SIM\')">Sim</button>'+
      '<button onclick="document.getElementById(\'sel-'+id+'\').value=\'NÃO\';atualizarCard(\''+id+'\',\'NÃO\')">Não</button>'+
      '<button onclick="document.getElementById(\'sel-'+id+'\').value=\'\';atualizarCard(\''+id+'\',\'\')" style="margin-left:auto">Limpar</button>'+
      '<input id="just-'+id+'" type="text" placeholder="Justificativa..." value="'+esc(just)+'" '+justDisabled+'>'+
      '<button id="btn-'+id+'" class="btn-salvar" onclick="salvar(\''+id+'\')">💾 Salvar</button>'+
      '<div id="aviso-'+id+'" class="aviso">Alterações não salvas</div>'+
    '</div>'+
  '</div>';
}

function atualizarCard(id,valor){
  var card=document.getElementById('card-'+id);
  if(!card)return;
  
  _pendentes[id]={part:valor};
  
  var btn=document.getElementById('btn-'+id);
  if(btn){ btn.disabled=false; btn.className='btn-salvar ativo'; }

  var aviso=document.getElementById('aviso-'+id);
  if(aviso) aviso.style.display='block';

  var pill=card.querySelector('.status-pill');
  if(pill){
    if(valor==='SIM') pill.outerHTML='<span class="status-pill s-sim">✓ Participar</span>';
    else if(valor==='NÃO') pill.outerHTML='<span class="status-pill s-nao">✕ Recusado</span>';
    else pill.outerHTML='<span class="status-pill s-pend">— Pendente</span>';
  }
  card.className='card '+(valor==='SIM'?'sim':valor==='NÃO'?'nao':'');
}

async function salvar(id){
  var d=TODOS.find(function(x){return x.id===id;});
  if(!d) return;

  var btn=document.getElementById('btn-'+id);
  if(btn){btn.disabled=true;btn.textContent='Salvando...';}

  var arr=d.arr.slice();
  if(_pendentes[id]&&_pendentes[id].part) arr[10]=_pendentes[id].part;
  var just=document.getElementById('just-'+id);
  if(just) arr[12]=just.value.trim();

  try{
    await db.collection('editais').doc(id).set({_id:d._id,_arr:arr,_updatedAt:Date.now()},{merge:true});
    d.arr=arr;
    delete _pendentes[id];

    var aviso=document.getElementById('aviso-'+id);
    if(aviso) aviso.style.display='none';

    atualizarStats();
    toast('✅ Salvo com sucesso!','ok');
  }catch(e){
    console.error('Erro ao salvar:', e);
    toast('Erro ao salvar: '+e.message,'err');
    if(btn){btn.disabled=false;btn.textContent='💾 Salvar';}
    return;
  }

  if(btn){btn.disabled=false;btn.textContent='💾 Salvar';}
}

function renderizar(){
  atualizarStats();
  var lista=getFiltrados();
  if(!lista.length){
    document.getElementById('main-content').innerHTML='<div class="empty"><div class="empty-ico">📭</div>Nenhum edital neste filtro</div>';
    return;
  }
  var html='<div class="cards">'+lista.map(function(d){return renderCard(d);}).join('')+'</div>';
  document.getElementById('main-content').innerHTML=html;
}

async function carregarEditais(){
  try{
    console.log('Carregando editais...');
    var snap=await db.collection('editais').orderBy('_id','desc').get();
    TODOS=[];
    snap.forEach(function(doc){
      var d=doc.data();
      TODOS.push({id:doc.id,_id:d._id,arr:d._arr||[]});
    });
    TODOS.sort(function(a,b){return b._id-a._id;});
    _canon=null;
    buildFiltrosEmpresas();
    buildFiltrosResp();
    setFiltroStatus(FILTRO_STATUS);
    console.log('✅ Editais carregados:', TODOS.length);
  }catch(e){
    console.error('Erro ao carregar editais:', e);
    document.getElementById('main-content').innerHTML='<div class="empty"><div class="empty-ico">⚠️</div>Erro ao carregar: '+esc(e.message)+'</div>';
    document.getElementById('main-content').style.display='block';
    document.getElementById('ac-login').style.display='none';
  }
}

function abrirApp(){
  console.log('Abrindo aplicativo...');
  document.getElementById('ac-login').style.display='none';
  document.getElementById('main-content').style.display='block';
  carregarEditais();
}

function entrar(){
  var wpp=document.getElementById('lg-wpp').value;
  var senha=document.getElementById('lg-senha').value;
  if(!wpp||!senha){
    toast('Preencha o WhatsApp e a senha','err');
    return;
  }
  abrirApp();
}

document.addEventListener('DOMContentLoaded',function(){
  console.log('DOM carregado');
  
  document.querySelectorAll('#filtros-status .stat').forEach(function(c){
    c.addEventListener('click',function(){setFiltroStatus(c.getAttribute('data-f'));});
  });

  /* Verificar autenticação — se estiver logado, abrir app direto */
  auth.onAuthStateChanged(function(user){
    console.log('Auth State Changed:', user ? user.email : 'Não autenticado');
    if(user){
      abrirApp();
    } else {
      console.log('Usuário não autenticado — mostrando login');
      document.getElementById('ac-login').style.display='flex';
      document.getElementById('main-content').style.display='none';
    }
  });
});
</script>
