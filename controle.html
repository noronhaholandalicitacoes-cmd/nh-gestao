:root{
  --bg:#0a0e1a;--bg2:#111a30;--vidro:rgba(16,21,36,.55);--linha:rgba(255,255,255,.08);--linha2:rgba(255,255,255,.16);
  --t1:#eef1f7;--t2:#b6bdcc;--t3:#7c8496;--nh:#f97316;--nh2:#fb923c;--roxo:#7c3aed;--azul:#3b82f6;--verde:#22c55e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:Outfit,system-ui,sans-serif;overflow:hidden}
/* Fundo com a cara do Gestão e do Portal geral (pedido do cliente: "não
   precisa ser todo preto — um escuro meio azulado com cores laranjas"):
   o mesmo #0a0e1a e as mesmas três luzes que derivam devagar. */
body{background:
  radial-gradient(ellipse 60% 50% at 50% 44%,rgba(249,115,22,.13),transparent 70%),
  linear-gradient(180deg,#0d1428 0%,#0a0e1a 55%,#0b1020 100%)}
.atm{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.atm i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.atm .o1{width:640px;height:640px;background:radial-gradient(circle,rgba(249,115,22,.28),transparent 68%);top:-18%;left:-10%;animation:der1 26s ease-in-out infinite}
.atm .o2{width:560px;height:560px;background:radial-gradient(circle,rgba(59,130,246,.24),transparent 68%);top:20%;right:-12%;animation:der2 32s ease-in-out infinite}
.atm .o3{width:480px;height:480px;background:radial-gradient(circle,rgba(168,85,247,.20),transparent 68%);bottom:-14%;left:30%;animation:der3 29s ease-in-out infinite}
@keyframes der1{50%{transform:translate(70px,50px)}}
@keyframes der2{50%{transform:translate(-60px,60px)}}
@keyframes der3{50%{transform:translate(50px,-45px)}}
#fundo{position:fixed;inset:0;z-index:0;pointer-events:none}
.grade{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse 70% 60% at 50% 50%,#000 30%,transparent 80%)}

/* ── Topo ── */
.topo{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 26px}
.selo{position:relative;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.selo i{position:absolute;border-radius:50%;border:2px solid transparent;animation:gira 6s linear infinite}
.selo i.a1{inset:0;border-top-color:rgba(249,115,22,.7);border-right-color:rgba(249,115,22,.2);animation-duration:4s}
.selo i.a2{inset:5px;border-top-color:rgba(124,58,237,.7);border-left-color:rgba(124,58,237,.2);animation-direction:reverse}
.selo i.a3{inset:10px;border-bottom-color:rgba(59,130,246,.7);border-right-color:rgba(59,130,246,.2);animation-duration:8s}
.selo b{width:30px;height:30px;border-radius:50%;background:var(--nh-logo) center/cover no-repeat;box-shadow:0 0 18px rgba(249,115,22,.45)}
@keyframes gira{to{transform:rotate(360deg)}}
/* Para o que é centralizado com translate: girar sem perder o centro. */
@keyframes giraC{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
.marca{line-height:1.15}
.marca .j{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:.42em;font-size:13px;color:var(--t1)}
.marca .s{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.32em;color:var(--t3);margin-top:4px}
.topo .dir{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;font-size:11px;font-weight:600;
  font-family:'JetBrains Mono',monospace;letter-spacing:.06em;color:var(--t2);background:var(--vidro);border:1px solid var(--linha);backdrop-filter:blur(10px)}
.chip .p{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.chip.ok .p{background:var(--verde);box-shadow:0 0 8px var(--verde)}
.chip.erro .p{background:#ef4444;box-shadow:0 0 8px #ef4444}
.bt-ic{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
  background:var(--vidro);border:1px solid var(--linha);color:var(--t2);backdrop-filter:blur(10px);transition:.2s}
.bt-ic:hover{border-color:var(--linha2);color:var(--t1)}
.bt-ic.on{color:var(--nh);border-color:rgba(249,115,22,.5)}
.bt-ic svg{width:16px;height:16px}

/* ── Palco: esfera + órbita ── */
.palco{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center}
.orbita{position:relative;width:min(92vw,980px);height:min(68vh,640px);transform:translateY(-5vh)}
.anel{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;border:1px solid rgba(249,115,22,.10)}
.anel.r1{width:min(46vh,400px);height:min(46vh,400px)}
.anel.r2{width:min(78vh,700px);height:min(56vh,500px);border-color:rgba(255,255,255,.05);border-style:dashed}
.anel.r3{width:min(62vh,560px);height:min(62vh,560px);border-color:transparent;border-top-color:rgba(249,115,22,.35);border-right-color:rgba(124,58,237,.18);animation:giraC 18s linear infinite}
#orbe{position:absolute;left:50%;top:50%;width:min(44vh,380px);height:min(44vh,380px);transform:translate(-50%,-50%);cursor:pointer;border-radius:50%}
.estado{position:absolute;left:50%;top:calc(50% + min(24vh,205px));transform:translateX(-50%);font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:.5em;color:var(--nh2);text-shadow:0 0 12px rgba(249,115,22,.6);white-space:nowrap}
/* ── Módulos dos sistemas (27/10/2026) ─────────────────────────────────
   Pedido: "ridículo esses ícones, quero algo grandioso e digital". Cada
   sistema é um módulo holográfico: moldura hexagonal com borda de energia
   girando, vidro escuro com linhas de varredura, ícone em neon, código do
   módulo e a função dele. Acende inteiro quando o Jarvis usa o sistema. */
.no{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;
  color:var(--t2);z-index:3;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.hex{position:relative;width:96px;height:108px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  filter:drop-shadow(0 0 0 transparent);transition:filter .35s}
.hex-borda{position:absolute;inset:-40%;animation:gira 5s linear infinite;
  background:conic-gradient(from 0deg,transparent 0 55%,rgba(249,115,22,.15) 65%,rgba(251,146,60,.95) 80%,rgba(124,58,237,.55) 88%,transparent 95%)}
.hex-base{position:absolute;inset:0;background:linear-gradient(160deg,rgba(249,115,22,.28),rgba(124,58,237,.18) 55%,rgba(59,130,246,.22))}
.hex-in{position:absolute;inset:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px),
    radial-gradient(circle at 50% 35%,rgba(249,115,22,.22),transparent 62%),
    linear-gradient(180deg,#121a2e,#070b16)}
.hex-in::after{content:'';position:absolute;left:0;right:0;height:38%;top:-40%;
  background:linear-gradient(180deg,transparent,rgba(251,146,60,.22),transparent);animation:varre 3.6s ease-in-out infinite}
@keyframes varre{0%{top:-40%}60%,100%{top:110%}}
.hex-in svg{width:38px;height:38px;color:#ffd9b8;filter:drop-shadow(0 0 6px rgba(249,115,22,.85)) drop-shadow(0 0 16px rgba(249,115,22,.45));position:relative;z-index:1}
.hex-cod{position:absolute;bottom:17px;left:0;right:0;text-align:center;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.22em;color:rgba(251,146,60,.75);z-index:1}
.rot{text-align:center;line-height:1.25}
.rot b{display:block;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:.24em;color:var(--t1);
  text-shadow:0 0 12px rgba(249,115,22,.35);white-space:nowrap}
.rot small{display:block;margin-top:3px;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.2em;color:var(--t3);white-space:nowrap}
.no:hover{transform:translate(-50%,-50%) scale(1.07)}
.no:hover .hex{filter:drop-shadow(0 0 14px rgba(249,115,22,.55))}
.no:hover .hex-borda{animation-duration:2s}
.no.ativo .hex{filter:drop-shadow(0 0 22px rgba(249,115,22,.9));animation:acende 1.3s ease-in-out infinite}
.no.ativo .hex-borda{animation-duration:1.2s;background:conic-gradient(from 0deg,rgba(249,115,22,.35),rgba(255,214,170,1),rgba(249,115,22,.35),rgba(255,214,170,1),rgba(249,115,22,.35))}
.no.ativo .rot b{color:var(--nh2)}
@keyframes acende{50%{filter:drop-shadow(0 0 34px rgba(249,115,22,1))}}
#linhas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#linhas line{stroke-dasharray:3 7;animation:fluxo 1.6s linear infinite}
#linhas line.on{stroke-dasharray:6 6;animation-duration:.5s}
@keyframes fluxo{to{stroke-dashoffset:-22}}
/* Anel de leitura em volta da esfera: marcações e uma varredura girando. */
.hud{position:absolute;left:50%;top:50%;width:min(52vh,450px);height:min(52vh,450px);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(249,115,22,.55) 0 .6deg,transparent .6deg 5deg);
  -webkit-mask:radial-gradient(circle,transparent 64%,#000 64.5%,#000 66.5%,transparent 67%);mask:radial-gradient(circle,transparent 64%,#000 64.5%,#000 66.5%,transparent 67%);
  animation:giraC 60s linear infinite reverse}
.hud.v{background:conic-gradient(from 0deg,rgba(249,115,22,.0),rgba(249,115,22,.55) 40deg,transparent 41deg);
  -webkit-mask:radial-gradient(circle,transparent 58%,#000 59%,#000 69%,transparent 70%);mask:radial-gradient(circle,transparent 58%,#000 59%,#000 69%,transparent 70%);
  animation:giraC 6s linear infinite}

/* ── Fala do Jarvis e do chefe ── */
.legenda{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);z-index:4;width:min(860px,92vw);text-align:center;pointer-events:none}
.legenda .eu{font-size:13px;color:var(--t3);margin-bottom:8px;min-height:18px}
.legenda .ele{font-size:17px;line-height:1.55;color:var(--t1);text-shadow:0 2px 18px rgba(0,0,0,.8);max-height:30vh;overflow:auto;pointer-events:auto;
  white-space:pre-wrap;scrollbar-width:none}
.legenda .ele::-webkit-scrollbar{display:none}

/* ── Barra de comando (discreta) ── */
.barra{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:6;width:min(640px,92vw);display:flex;align-items:center;gap:10px;
  padding:7px 7px 7px 18px;border-radius:999px;background:rgba(10,14,26,.62);border:1px solid var(--linha);backdrop-filter:blur(16px);
  box-shadow:0 18px 50px rgba(0,0,0,.45);opacity:.72;transition:opacity .25s,border-color .25s}
.barra:hover,.barra:focus-within{opacity:1;border-color:rgba(249,115,22,.35)}
.barra input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--t1);font:inherit;font-size:14px}
.barra input::placeholder{color:var(--t3)}
.mic{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:#111;
  background:linear-gradient(135deg,var(--nh2),var(--nh));box-shadow:0 0 18px rgba(249,115,22,.45);transition:.2s;flex-shrink:0}
.mic svg{width:18px;height:18px}
.mic.ouvindo{animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{box-shadow:0 0 0 10px rgba(249,115,22,.12),0 0 28px rgba(249,115,22,.7)}}
.enviar{background:none;border:none;color:var(--t3);cursor:pointer;display:inline-flex;padding:6px}
.enviar:hover{color:var(--nh)}
.enviar svg{width:18px;height:18px}
.dica{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:5;font-size:10.5px;color:var(--t3);font-family:'JetBrains Mono',monospace;letter-spacing:.08em;white-space:nowrap}

/* ── Painel de conversa ── */
.painel{position:fixed;top:0;right:0;bottom:0;z-index:8;width:min(420px,100vw);background:rgba(8,11,20,.92);border-left:1px solid var(--linha);
  backdrop-filter:blur(18px);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.painel.aberto{transform:none}
.painel h3{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;color:var(--t3);padding:22px 22px 12px;display:flex;align-items:center}
.painel h3 button{margin-left:auto}
.msgs{flex:1;overflow:auto;padding:4px 22px 22px;display:flex;flex-direction:column;gap:12px}
.m{max-width:92%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.m.chefe{align-self:flex-end;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.28)}
.m.jarvis{align-self:flex-start;background:rgba(255,255,255,.04);border:1px solid var(--linha)}
.m small{display:block;margin-top:5px;font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace}

/* ── Entrada (sem login) ── */
.porta{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,14,26,.88);backdrop-filter:blur(8px)}
.porta.on{display:flex}
.porta form{display:flex;flex-direction:column;align-items:center;width:min(360px,90vw);padding:34px 30px;border-radius:22px;
  background:linear-gradient(170deg,rgba(17,26,48,.92),rgba(10,14,26,.94));border:1px solid rgba(249,115,22,.25);
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 60px rgba(249,115,22,.10)}
.porta-tit{margin-top:18px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;letter-spacing:.5em;color:var(--t1);padding-left:.5em}
.porta-sub{margin:6px 0 22px;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.28em;color:var(--t3)}
.porta input{width:100%;height:46px;margin-bottom:10px;padding:0 15px;border-radius:12px;background:rgba(5,9,20,.7);border:1px solid var(--linha2);
  color:var(--t1);font:inherit;font-size:14.5px;outline:none;transition:border-color .2s}
.porta input:focus{border-color:rgba(249,115,22,.6);box-shadow:0 0 0 3px rgba(249,115,22,.12)}
.porta button{width:100%;height:46px;margin-top:6px;border:none;border-radius:12px;cursor:pointer;font:inherit;font-weight:800;letter-spacing:.08em;color:#111;
  background:linear-gradient(135deg,var(--nh2),var(--nh));box-shadow:0 0 22px rgba(249,115,22,.35)}
.porta button:disabled{opacity:.6;cursor:wait}
.porta p{color:var(--t3);font-size:12px;margin-top:16px;line-height:1.55;text-align:center;min-height:18px}
.porta p.erro{color:#f87171}

@media (max-width:760px){
  .topo{padding:14px 16px}.topo .chip.so-pc{display:none}
  .orbita{height:62vh}
  .hex{width:62px;height:70px}.hex-in svg{width:24px;height:24px}.hex-cod{display:none}.rot b{font-size:8.5px;letter-spacing:.14em}.rot small{display:none}.hud{width:min(40vh,300px);height:min(40vh,300px)}
  .legenda{bottom:104px}.legenda .ele{font-size:15px}
  .dica{display:none}
}
@media (prefers-reduced-motion:reduce){.anel.r3{animation:none}}
</style>
</head>

  a.className = 'no'; a.id = 'no-' + s.id; a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
  a.title = 'Abrir ' + s.nome;
  a.innerHTML = '<span class="hex"><i class="hex-borda"></i><i class="hex-base"></i><span class="hex-in">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' + s.ic + '</svg>' +
    '<em class="hex-cod">SYS-0' + (i + 1) + '</em></span></span>' +
    '<span class="rot"><b>' + s.nome.toUpperCase() + '</b><small>' + (FUNCAO[s.id] || '') + '</small></span>';
  orbita.appendChild(a);
});
function posicionar(){
  var w = orbita.clientWidth, h = orbita.clientHeight, cx = w/2, cy = h/2;
  var rx = Math.min(w*0.46, 450), ry = Math.min(h*0.47, 330);
  var ro = document.querySelector('.hud').clientWidth * 0.335;   /* as linhas saem da borda do anel de leitura */
  var svg = document.getElementById('linhas'), linhas = '';
  /* O arco de baixo fica livre: é onde aparecem a fala e a barra de
     comando. Os sistemas vão de baixo-esquerda, pelo alto, até
     baixo-direita (125° a 415°, ângulos de tela). */
  var ini = 125 * Math.PI/180, passo = (290 * Math.PI/180) / (SISTEMAS.length - 1);
  SISTEMAS.forEach(function(s, i){
    var ang = ini + i * passo;
    var x = cx + rx*Math.cos(ang), y = cy + ry*Math.sin(ang);
    var el = document.getElementById('no-' + s.id);
    el.style.left = x + 'px'; el.style.top = y + 'px';
    linhas += '<line id="ln-' + s.id + '" x1="' + (cx + Math.cos(ang)*ro) + '" y1="' + (cy + Math.sin(ang)*ro) + '" x2="' + x + '" y2="' + y + '" stroke="rgba(249,115,22,.38)" stroke-width="1.2"/>';
  });
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); svg.innerHTML = linhas;
}
addEventListener('resize', posicionar); posicionar();
function acender(ids){
  document.querySelectorAll('.no.ativo').forEach(function(n){ n.classList.remove('ativo'); });
  document.querySelectorAll('#linhas line').forEach(function(l){ l.setAttribute('stroke','rgba(249,115,22,.38)'); l.setAttribute('stroke-width','1.2'); l.classList.remove('on'); });
  (ids||[]).forEach(function(id){
    var n = document.getElementById('no-' + id); if(n) n.classList.add('ativo');
    var l = document.getElementById('ln-' + id); if(l){ l.setAttribute('stroke','rgba(255,190,130,.95)'); l.setAttribute('stroke-width','2'); l.classList.add('on'); }
  });
}

/* ── A esfera ──────────────────────────────────────────────────────── */
var ESTADO = 'conectando', fala = 0;
var ROTULO = {conectando:'CONECTANDO', pronto:'PRONTO', ouvindo:'OUVINDO', pensando:'PENSANDO', falando:'FALANDO', erro:'SEM CONEXÃO'};
function estado(e){ ESTADO = e; document.getElementById('estado').textContent = ROTULO[e] || e.toUpperCase();
  document.getElementById('mic').classList.toggle('ouvindo', e === 'ouvindo'); }
(function(){
  var cv = document.getElementById('orbe'), cx = cv.getContext('2d'), N = 1100, pts = [];
  for(var i = 0; i < N; i++){            /* esfera de Fibonacci: pontos espalhados por igual */
    var y = 1 - (i/(N-1))*2, r = Math.sqrt(1 - y*y), th = i * 2.399963;
    pts.push({x: Math.cos(th)*r, y: y, z: Math.sin(th)*r, s: Math.random()});
  }
  var rot = 0, pulso = 0;
  function quadro(t){
    var d = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if(cv.width !== W*d){ cv.width = W*d; cv.height = H*d; }
    cx.setTransform(d,0,0,d,0,0); cx.clearRect(0,0,W,H);
    var vel = {ouvindo:.012, pensando:.03, falando:.009}[ESTADO] || .004;
    rot += vel;
    var alvo = ESTADO === 'falando' ? .12 + fala*.18 : ESTADO === 'ouvindo' ? .06 + .04*Math.sin(t/180) : ESTADO === 'pensando' ? .03 : .015*Math.sin(t/900);
    pulso += (alvo - pulso) * .12;
    var R = Math.min(W,H) * .36 * (1 + pulso), c = Math.cos(rot), s = Math.sin(rot), ci = Math.cos(.38), si = Math.sin(.38);
    var g = cx.createRadialGradient(W/2,H/2,0,W/2,H/2,R*1.5);
    var halo = ESTADO === 'pensando' ? '124,58,237' : '249,115,22';
    g.addColorStop(0,'rgba(' + halo + ',.22)'); g.addColorStop(1,'rgba(' + halo + ',0)');
    cx.fillStyle = g; cx.beginPath(); cx.arc(W/2,H/2,R*1.5,0,7); cx.fill();
    for(var i = 0; i < N; i++){
      var p = pts[i];
      var x = p.x*c - p.z*s, z = p.x*s + p.z*c, y = p.y*ci - z*si; z = p.y*si + z*ci;
      var tremor = ESTADO === 'pensando' ? 1 + .05*Math.sin(t/120 + p.s*20) : 1;
      var k = (z + 2) / 3, px = W/2 + x*R*tremor, py = H/2 + y*R*tremor;
      var brilho = .15 + .85*k*k*(.6 + .4*Math.sin(t/400 + p.s*30));
      var cor = ESTADO === 'pensando' && p.s > .6 ? '167,139,250' : p.s > .85 ? '255,236,200' : '251,170,90';
      cx.fillStyle = 'rgba(' + cor + ',' + brilho.toFixed(3) + ')';
      cx.beginPath(); cx.arc(px, py, .6 + k*1.5, 0, 7); cx.fill();
    }
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);
})();
/* Poeira ao fundo, bem discreta. */
(function(){
  var cv = document.getElementById('fundo'), cx = cv.getContext('2d'), P = [];
  function tam(){ cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener('resize', tam); tam();
  for(var i = 0; i < 90; i++) P.push({x: Math.random(), y: Math.random(), v: .00005 + Math.random()*.0002, r: Math.random()*1.3});
  (function q(){
    cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(function(p){ p.y -= p.v; if(p.y < 0) p.y = 1;
      cx.fillStyle = 'rgba(249,140,60,' + (.08 + p.r*.12) + ')'; cx.beginPath(); cx.arc(p.x*cv.width, p.y*cv.height, p.r, 0, 7); cx.fill(); });
    requestAnimationFrame(q);
  })();
})();

/* ── Voz: falar ────────────────────────────────────────────────────── */
var VOZ_LIGADA = (function(){ try{ return localStorage.getItem('jarvis_voz') !== '0'; }catch(e){ return true; } })();
var vozPt = null;
function escolherVoz(){
  var vs = speechSynthesis.getVoices().filter(function(v){ return /^pt(-|_)BR/i.test(v.lang); });
  vozPt = vs.find(function(v){ return /Google/i.test(v.name); }) || vs.find(function(v){ return /Antonio|Daniel|Francisca|Thalita|Natural/i.test(v.name); }) || vs[0] || null;
}
if('speechSynthesis' in window){ escolherVoz(); speechSynthesis.onvoiceschanged = escolherVoz; }
function paraFala(t){
  return String(t||'').replace(/\*\*|__|`|#+\s?/g,'').replace(/^\s*[-•]\s+/gm,'').replace(/\[(.*?)\]\(.*?\)/g,'$1')
    .replace(/R\$\s?/g,'R$ ').replace(/\n{2,}/g,'. ').replace(/\n/g,', ');
}
function falar(t){
  if(!VOZ_LIGADA || !('speechSynthesis' in window)){ estado('pronto'); return; }
  speechSynthesis.cancel();
  /* Frase por frase: o Chrome corta falas longas no meio. */
  var partes = paraFala(t).match(/[^.!?]+[.!?]*/g) || [paraFala(t)];
  var i = 0, timer = null;
  estado('falando');
  timer = setInterval(function(){ fala = .4 + Math.random()*.6; }, 110);
  (function proxima(){
    if(i >= partes.length){ clearInterval(timer); fala = 0; if(ESTADO === 'falando') estado('pronto'); return; }
    var u = new SpeechSynthesisUtterance(partes[i++].trim());
    u.lang = 'pt-BR'; if(vozPt) u.voice = vozPt; u.rate = 1.04; u.pitch = .92;
    u.onend = proxima; u.onerror = function(){ clearInterval(timer); fala = 0; estado('pronto'); };
    speechSynthesis.speak(u);
  })();
}
function calar(){ try{ speechSynthesis.cancel(); }catch(e){} fala = 0; if(ESTADO === 'falando') estado('pronto'); }
document.getElementById('bt-voz').addEventListener('click', function(){
  VOZ_LIGADA = !VOZ_LIGADA; this.classList.toggle('on', VOZ_LIGADA);
  this.title = VOZ_LIGADA ? 'Voz do Jarvis ligada — clique para silenciar' : 'Voz do Jarvis desligada — clique para ligar';
  try{ localStorage.setItem('jarvis_voz', VOZ_LIGADA ? '1' : '0'); }catch(e){}
  if(!VOZ_LIGADA) calar();
});
document.getElementById('bt-voz').classList.toggle('on', VOZ_LIGADA);

/* ── Voz: ouvir ────────────────────────────────────────────────────── */
var Rec = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, ouvindo = false;
function ouvir(){
  if(!Rec){ document.getElementById('ele').textContent = 'Este navegador não ouve — use o Chrome ou o Edge, ou digite abaixo.'; return; }
  if(ouvindo){ rec.stop(); return; }
  calar();
  rec = new Rec(); rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
  var final = '';
  rec.onresult = function(ev){
    var parcial = '';
    for(var i = ev.resultIndex; i < ev.results.length; i++){
      if(ev.results[i].isFinal) final += ev.results[i][0].transcript; else parcial += ev.results[i][0].transcript;
    }
    document.getElementById('eu').textContent = (final + parcial).trim();
  };
  rec.onend = function(){ ouvindo = false; if(final.trim()) enviar(final.trim()); else if(ESTADO === 'ouvindo') estado('pronto'); };
  rec.onerror = function(e){ ouvindo = false; estado('pronto');
    if(e.error === 'not-allowed') document.getElementById('ele').textContent = 'Preciso da permissão do microfone — libere no cadeado da barra de endereço.'; };
  ouvindo = true; estado('ouvindo'); rec.start();
}
document.getElementById('mic').addEventListener('click', ouvir);
document.getElementById('orbe').addEventListener('click', ouvir);
addEventListener('keydown', function(e){
  var digitando = document.activeElement && document.activeElement.id === 'txt';
  if(e.code === 'Space' && !digitando && !e.repeat){ e.preventDefault(); ouvir(); }
  if(e.key === 'Escape'){ calar(); if(ouvindo && rec) rec.abort(); }
});

/* ── Conversa ──────────────────────────────────────────────────────── */
var msgsEl = document.getElementById('msgs');
function hora(ms){ var d = new Date(ms||Date.now()); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function bolha(papel, texto, em){
  var d = document.createElement('div'); d.className = 'm ' + papel; d.textContent = texto;
  var s = document.createElement('small'); s.textContent = (papel === 'jarvis' ? 'JARVIS · ' : 'VOCÊ · ') + hora(em); d.appendChild(s);
  msgsEl.appendChild(d); msgsEl.scrollTop = msgsEl.scrollHeight;
}
var ocupado = false;
async function enviar(texto){
  texto = String(texto||'').trim(); if(!texto || ocupado) return;
  if(!auth.currentUser){ document.getElementById('porta').classList.add('on'); return; }
  ocupado = true; estado('pensando'); acender([]);
  document.getElementById('eu').textContent = texto; document.getElementById('ele').textContent = '';
  bolha('chefe', texto);
  try{
    var r = await fetch(NH_API + '/api/jarvis/conversa', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({idToken: await auth.currentUser.getIdToken(), mensagem: texto})});
    var j = await r.json().catch(function(){ return {}; });
    if(!r.ok || !j.ok) throw new Error(j.erro || ('HTTP ' + r.status));
    acender(j.sistemas);
    document.getElementById('ele').textContent = j.texto;
    bolha('jarvis', j.texto);
    falar(j.texto);
  }catch(e){
    var m = 'Chefe, deu um problema: ' + (e.message || e);
    document.getElementById('ele').textContent = m; bolha('jarvis', m); estado('pronto');
  }finally{ ocupado = false; }
}
document.getElementById('barra').addEventListener('submit', function(e){
  e.preventDefault(); var i = document.getElementById('txt'); var v = i.value; i.value = ''; enviar(v);
});
var painel = document.getElementById('painel');
document.getElementById('bt-conv').addEventListener('click', function(){ painel.classList.toggle('aberto'); });
document.getElementById('bt-fechar').addEventListener('click', function(){ painel.classList.remove('aberto'); });

/* ── Entrada ───────────────────────────────────────────────────────── */
function chip(id, ok, txt){ var c = document.getElementById(id); c.classList.toggle('ok', ok === true); c.classList.toggle('erro', ok === false); if(txt) c.lastChild.textContent = txt; }
fetch(NH_API + '/api/health', {cache:'no-store'}).then(function(r){ return r.json(); })
  .then(function(h){ chip('ch-srv', !!(h && h.chaveClaude), h && h.chaveClaude ? 'SERVIDOR' : 'SEM CHAVE DA IA'); })
  .catch(function(){ chip('ch-srv', false, 'SERVIDOR FORA'); estado('erro'); });
/* ── Entrar e sair ─────────────────────────────────────────────────── */
function portaMsg(t, erro){ var p = document.getElementById('porta-txt'); p.textContent = t; p.classList.toggle('erro', !!erro); }
document.getElementById('porta-form').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var login = String(document.getElementById('pt-login').value || '').trim().toLowerCase();
  var senha = document.getElementById('pt-senha').value;
  if(!login || !senha){ portaMsg('Preencha o login e a senha.', true); return; }
  if(!/^[a-z0-9._-]{3,30}$/.test(login)){ portaMsg('Login ou senha incorretos.', true); return; }
  var bt = document.getElementById('pt-entrar'); bt.disabled = true; bt.textContent = 'Entrando…'; portaMsg('');
  try{
    await auth.signInWithEmailAndPassword('controle-' + login + '@nh.interno', senha);
    document.getElementById('pt-senha').value = '';
  }catch(e){
    var c = String(e && e.code || '');
    portaMsg(/too-many-requests/.test(c) ? 'Muitas tentativas. Aguarde alguns minutos.' : /network/.test(c) ? 'Sem conexão. Tente de novo.' : 'Login ou senha incorretos.', true);
  }finally{ bt.disabled = false; bt.textContent = 'Entrar'; }
});
document.getElementById('bt-sair').addEventListener('click', function(){
  calar(); auth.signOut(); msgsEl.innerHTML = ''; document.getElementById('ele').textContent = ''; document.getElementById('eu').textContent = '';
});

auth.onAuthStateChanged(async function(u){
  if(!u){ document.getElementById('porta').classList.add('on'); estado('pronto'); setTimeout(function(){ document.getElementById('pt-login').focus(); }, 50); return; }
  document.getElementById('porta').classList.remove('on');
  try{
    var r = await fetch(NH_API + '/api/jarvis/historico', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({idToken: await u.getIdToken()})});
    var j = await r.json().catch(function(){ return {}; });
    if(r.status === 403){ await auth.signOut(); portaMsg(j.erro || 'Este login não tem acesso ao Controle.', true); document.getElementById('porta').classList.add('on'); return; }
    if(!r.ok || !j.ok) throw new Error(j.erro || ('HTTP ' + r.status));
    (j.conversa || []).forEach(function(m){ bolha(m.papel === 'jarvis' ? 'jarvis' : 'chefe', m.texto, m.em); });
    chip('ch-mem', true, 'MEMÓRIA · ' + (j.fatos || 0) + ' FATOS');
    var primeiro = String(j.nome || '').split(/\s+/)[0];
    document.getElementById('ele').textContent = (j.conversa || []).length
      ? 'De volta, ' + (primeiro || 'chefe') + '. Pergunte "o que mudou desde ontem?" ou fale o que precisa.'
      : 'Olá, ' + (primeiro || 'chefe') + '. Sou o Jarvis da NH. Toque na esfera ou aperte espaço para falar.';
  }catch(e){
    chip('ch-mem', false, 'MEMÓRIA INDISPONÍVEL');
    document.getElementById('ele').textContent = 'Conectei, mas não consegui ler a memória: ' + (e.message || e);
  }
  estado('pronto');
});
</script>
